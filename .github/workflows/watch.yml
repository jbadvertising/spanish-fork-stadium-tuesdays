name: stadium-tuesdays-watch

# Daily watcher for Cinemark Spanish Fork Tuesday stadium-seating showtimes.
# Runs the pure-HTTP watcher script, commits its state + board feed back to
# this repo, and pushes ntfy alerts (CINEMARK_NTFY_TOPIC secret) when new
# showtimes appear or presale tickets go on sale.
#
# Notes:
# - The .last_run commit every run keeps GitHub from auto-disabling this
#   schedule after 60 days without repository activity.
# - GITHUB_TOKEN (contents: write) handles the push; no PAT needed because
#   the board reads showtimes.json from this repo, not from a gist.

on:
  schedule:
    - cron: "0 14 * * *"   # ~7-8 AM America/Denver
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          CINEMARK_WORKSPACE: ${{ github.workspace }}
          CINEMARK_NTFY_TOPIC: ${{ secrets.CINEMARK_NTFY_TOPIC }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 check_stadium.py

      - name: Commit state and board feed
        run: |
          git config user.name "cinemark-watcher"
          git config user.email "cinemark-watcher@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_run
          git add -A
          git diff --cached --quiet || git commit -m "watcher: daily update"
          git push
